# Re-tests Code Armour itself on every push: database recipes vs. real Postgres, webhooks with real
# signatures, the scanner, and the re-test kit catching undone fixes.
name: tests
on:
  push:
  pull_request:
  workflow_dispatch:   # lets you start the tests by hand (Actions tab, or: gh workflow run tests)
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm test
      - run: npm run test:firebase   # Firestore rules in the real emulator
