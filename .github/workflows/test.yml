# Re-tests Code Armour itself on every push: database recipes vs. real Postgres, webhooks with real
# signatures, the scanner, and the re-test kit catching undone fixes.
name: tests
on:
  push:
  pull_request:
  workflow_dispatch:   # lets you start the tests by hand (Actions tab, or: gh workflow run tests)
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm test
      - run: npm run test:firebase   # Firestore rules in the real emulator
